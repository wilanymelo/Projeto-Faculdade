<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Biblioteca Online</title>
    <link rel="stylesheet" href="Modules/styles.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <h1 class="logo">Biblioteca Online</h1>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="main">
      <div class="container">

        <div class="content-login login-box">

          <h2 class="login-title">Criar Conta</h2>

          <p class="login-subtitle">
            Cadastre-se para acessar sua biblioteca
          </p>

          <form id="cadastroForm" class="login-form">

            <input
              type="text"
              id="nome"
              placeholder="Nome completo"
              class="search-input"
              required
            />

            <input
              type="email"
              id="email"
              placeholder="seu@email.com"
              class="search-input"
              required
            />

            <input
              type="password"
              id="senha"
              placeholder="Senha (mínimo 6 caracteres)"
              class="search-input"
              required
            />

            <input
              type="password"
              id="confirmarSenha"
              placeholder="Confirmar senha"
              class="search-input"
              required
            />

            <div class="login-remember">
              <input type="checkbox" id="termos" required />
              <label for="termos">
                Concordo com os <a href="#">termos de serviço</a>
              </label>
            </div>

            <button type="submit" class="btn-primary btn-full">
              Criar Conta
            </button>

          </form>

          <p class="login-footer">
            Já tem conta?
            <a href="login.html">Entrar</a>
          </p>

        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 Todos os direitos reservados.</p>
      <p>Desenvolvido por Jaerverson & Wilany</p>
    </footer>

  </body>
   <script>
   console.log('Script carregado');

   const form = document.getElementById('cadastroForm');

   form.addEventListener('submit', async (e) => {
     e.preventDefault();

     try {

       const nome = document.getElementById('nome').value;
       const email = document.getElementById('email').value;
       const senha = document.getElementById('senha').value;
       const confirmarSenha = document.getElementById('confirmarSenha').value;

       if (senha !== confirmarSenha) {
          alert('As senhas não coincidem');
         return;
      }

       const response = await fetch('/register', {
         method: 'POST',
         headers: {
           'Content-Type': 'application/json'
         },
         body: JSON.stringify({
           nome,
           email,
           senha
         })
       });

       const data = await response.json();

       console.log(data);

       if (!response.ok) {
         alert(data.erro);
         return;
       }

       alert('Cadastro realizado com sucesso!');
       window.location.href = 'login.html';

     } catch (erro) {
       console.error(erro);
       alert('Erro ao conectar com o servidor');
     }
  });
</script>





</html>
